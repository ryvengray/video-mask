version: "3.8"

services:
  video-audit:
    build: .
    container_name: video-audit
    ports:
      - "8080:8080"
    environment:
      - CONTROLLER_URL=${CONTROLLER_URL:-http://host.docker.internal:8000}
      - CONTROLLER_TOKEN=${CONTROLLER_TOKEN:-}
      - CONTROLLER_AUTH_USER=${CONTROLLER_AUTH_USER:-}
      - CONTROLLER_AUTH_PASS=${CONTROLLER_AUTH_PASS:-}
    volumes:
      - video-audit-data:/app/data
      - video-audit-videos:/app/videos
      - video-audit-screenshots:/app/screenshots
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  video-audit-data:
    driver: local
  video-audit-videos:
    driver: local
  video-audit-screenshots:
    driver: local
