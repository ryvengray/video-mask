[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-mask"
version = "0.1.0"
description = "批量给视频中的人脸和银行卡添加马赛克"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "video-mask contributors"}]
dependencies = [
  "numpy>=1.23",
  "opencv-python>=4.8,<5",
]

[project.optional-dependencies]
cards = [
  "pillow>=9.0",
  "torch>=2.0",
  "transformers>=4.40",
]
dev = ["pytest>=7.0"]

[project.scripts]
vmask = "video_mask_batch:main"

[tool.setuptools]
py-modules = ["video_mask_batch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
