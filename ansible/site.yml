---
- name: Deploy the video-mask controller
  hosts: controller
  become: true
  roles:
    - role: video_mask_release
      vars:
        video_mask_runtime_profile: controller
    - video_mask_controller

- name: Deploy GPU video-mask workers
  hosts: gpu_workers
  become: true
  serial: 2
  roles:
    - role: video_mask_release
      vars:
        video_mask_runtime_profile: worker
    - video_mask_worker
