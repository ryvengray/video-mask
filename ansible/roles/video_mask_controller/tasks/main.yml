---
- name: Install controller Python prerequisites
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      - curl
      - unzip
    state: present
    update_cache: true

- name: Validate S3 configuration when S3 storage mode is selected
  ansible.builtin.assert:
    that:
      - video_mask_storage_mode | default('local') != 's3' or (video_mask_s3_source_bucket | default('') | length > 0)
      - video_mask_storage_mode | default('local') != 's3' or (video_mask_s3_output_bucket | default('') | length > 0)
      - video_mask_storage_mode | default('local') != 's3' or (video_mask_s3_source_region | default('') | length > 0)
    fail_msg: S3 mode requires source bucket, output bucket, and source region settings.

- name: Check whether AWS CLI v2 is installed
  ansible.builtin.stat:
    path: /usr/local/bin/aws
  register: video_mask_aws_cli

- name: Download AWS CLI v2 installer
  ansible.builtin.get_url:
    url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    dest: /tmp/video-mask-awscliv2.zip
    mode: '0644'
  when: not video_mask_aws_cli.stat.exists

- name: Unpack AWS CLI v2 installer
  ansible.builtin.unarchive:
    src: /tmp/video-mask-awscliv2.zip
    dest: /tmp
    remote_src: true
    creates: /tmp/aws/install
  when: not video_mask_aws_cli.stat.exists

- name: Install AWS CLI v2
  ansible.builtin.command:
    cmd: /tmp/aws/install
    creates: /usr/local/bin/aws
  when: not video_mask_aws_cli.stat.exists

- name: Install controller Python dependencies
  ansible.builtin.pip:
    requirements: "{{ video_mask_app_dir }}/requirements-cluster.txt"
    virtualenv: "{{ video_mask_app_dir }}/.venv"
    virtualenv_command: python3 -m venv

- name: Create controller state directory
  ansible.builtin.file:
    path: /var/lib/video-mask-controller
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0750'

- name: Install controller environment file
  ansible.builtin.template:
    src: video-mask-controller.env.j2
    dest: /etc/video-mask-controller.env
    owner: root
    group: root
    mode: '0600'
  notify: Restart video-mask controller

- name: Install controller systemd service
  ansible.builtin.template:
    src: video-mask-controller.service.j2
    dest: /etc/systemd/system/video-mask-controller.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd controller
    - Restart video-mask controller

- name: Enable controller service
  ansible.builtin.systemd:
    name: video-mask-controller
    enabled: true
    state: started

- name: Apply controller service changes before deploying Workers
  ansible.builtin.meta: flush_handlers

- name: Wait until the controller API is ready
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/healthz
    method: GET
    status_code: 200
  register: video_mask_controller_health
  retries: 12
  delay: 2
  until: video_mask_controller_health.status == 200
