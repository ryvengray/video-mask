---
- name: Validate release deployment configuration
  ansible.builtin.assert:
    that:
      - video_mask_release_repo is defined
      - video_mask_release_repo | length > 0
      - video_mask_release_deploy_key is defined
      - video_mask_release_deploy_key | length > 0
      - video_mask_release_version is defined
      - video_mask_release_version | length > 0
      - video_mask_runtime_profile in ['controller', 'worker']
    fail_msg: >-
      Configure video_mask_release_repo, video_mask_release_version and the
      vault-protected video_mask_release_deploy_key before deployment.

- name: Install release runtime prerequisites
  ansible.builtin.apt:
    name:
      - git
      - git-lfs
      - tar
      - ca-certificates
      - python3
      - python3-venv
      - python3-pip
    state: present
    update_cache: true

- name: Create release SSH directory
  ansible.builtin.file:
    path: /home/ubuntu/.ssh
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0700'

- name: Install shared read-only release Deploy Key
  ansible.builtin.copy:
    content: "{{ video_mask_release_deploy_key }}\n"
    dest: "{{ video_mask_release_deploy_key_path | default('/home/ubuntu/.ssh/video-mask-release') }}"
    owner: ubuntu
    group: ubuntu
    mode: '0600'
  no_log: true

- name: Checkout release repository
  ansible.builtin.git:
    repo: "{{ video_mask_release_repo }}"
    dest: "{{ video_mask_release_dir | default('/home/ubuntu/video-mask-release') }}"
    version: "{{ video_mask_release_ref | default('main') }}"
    update: true
    accept_newhostkey: true
    key_file: "{{ video_mask_release_deploy_key_path | default('/home/ubuntu/.ssh/video-mask-release') }}"
  become_user: ubuntu

- name: Download release archives stored with Git LFS
  ansible.builtin.command:
    cmd: git lfs pull
    chdir: "{{ video_mask_release_dir | default('/home/ubuntu/video-mask-release') }}"
  become_user: ubuntu
  changed_when: false

- name: Verify requested release archive exists
  ansible.builtin.stat:
    path: "{{ video_mask_release_dir | default('/home/ubuntu/video-mask-release') }}/artifacts/video-mask-linux-x86_64-{{ video_mask_release_version }}.tar.gz"
  register: video_mask_release_archive

- name: Fail when requested release archive is unavailable
  ansible.builtin.assert:
    that: video_mask_release_archive.stat.exists
    fail_msg: >-
      Release {{ video_mask_release_version }} is not present in the release
      repository. Build and push it before initializing this machine.

- name: Create immutable release runtime directory
  ansible.builtin.file:
    path: "{{ video_mask_release_install_root | default('/opt/video-mask/releases') }}/{{ video_mask_release_version }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Extract requested source-free release archive
  ansible.builtin.unarchive:
    src: "{{ video_mask_release_archive.stat.path }}"
    dest: "{{ video_mask_release_install_root | default('/opt/video-mask/releases') }}/{{ video_mask_release_version }}"
    remote_src: true
    creates: "{{ video_mask_release_install_root | default('/opt/video-mask/releases') }}/{{ video_mask_release_version }}/bin/video-mask-controller"

- name: Verify compiled release executables
  ansible.builtin.stat:
    path: "{{ video_mask_release_install_root | default('/opt/video-mask/releases') }}/{{ video_mask_release_version }}/bin/{{ item }}"
  loop:
    - video-mask-controller
    - video-mask-worker
    - video-mask-batch-fish
  register: video_mask_release_binaries

- name: Fail when compiled release is incomplete
  ansible.builtin.assert:
    that: item.stat.exists and item.stat.executable
    fail_msg: "Compiled release binary is missing or not executable: {{ item.stat.path }}"
  loop: "{{ video_mask_release_binaries.results }}"

- name: Install Worker OS libraries
  ansible.builtin.apt:
    name:
      - ffmpeg
      - curl
      - libgl1
      - libglib2.0-0
    state: present
  when: video_mask_runtime_profile == 'worker'

- name: Verify NVIDIA driver is available on GPU Worker
  ansible.builtin.command: nvidia-smi -L
  changed_when: false
  when: video_mask_runtime_profile == 'worker'

- name: Create public dependency virtual environment
  ansible.builtin.command:
    cmd: "python3 -m venv {{ video_mask_runtime_venv | default('/opt/video-mask/runtime-venv') }}"
    creates: "{{ video_mask_runtime_venv | default('/opt/video-mask/runtime-venv') }}/bin/python"

- name: Upgrade public dependency installer
  ansible.builtin.pip:
    name:
      - pip
      - setuptools
      - wheel
    state: latest
    virtualenv: "{{ video_mask_runtime_venv | default('/opt/video-mask/runtime-venv') }}"

- name: Install CUDA PyTorch for GPU Worker
  ansible.builtin.pip:
    name:
      - torch
      - torchvision
    state: latest
    virtualenv: "{{ video_mask_runtime_venv | default('/opt/video-mask/runtime-venv') }}"
    extra_args: "--index-url {{ video_mask_torch_index_url | default('https://download.pytorch.org/whl/cu128') }}"
  when: video_mask_runtime_profile == 'worker'

- name: Install public runtime dependencies
  ansible.builtin.pip:
    requirements: "{{ video_mask_release_install_root | default('/opt/video-mask/releases') }}/{{ video_mask_release_version }}/requirements-{{ video_mask_runtime_profile }}.txt"
    virtualenv: "{{ video_mask_runtime_venv | default('/opt/video-mask/runtime-venv') }}"
