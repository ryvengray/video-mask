---
- name: Install prerequisites used before bootstrap
  ansible.builtin.apt:
    name:
      - git
      - python3
      - python3-venv
      - python3-pip
    state: present
    update_cache: true

- name: Validate shared release key configuration
  ansible.builtin.assert:
    that:
      - video_mask_release_deploy_key is defined
      - video_mask_release_deploy_key | length > 0
    fail_msg: >-
      video_mask_release_repo is configured but video_mask_release_deploy_key
      is missing. Store the shared read-only Deploy Key in ansible-vault.
  when: video_mask_release_repo | default('') | length > 0

- name: Create Worker SSH directory for release access
  ansible.builtin.file:
    path: /home/ubuntu/.ssh
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0700'
  when: video_mask_release_repo | default('') | length > 0

- name: Install shared read-only release Deploy Key
  ansible.builtin.copy:
    content: "{{ video_mask_release_deploy_key }}\n"
    dest: "{{ video_mask_release_deploy_key_path | default('/home/ubuntu/.ssh/video-mask-release') }}"
    owner: ubuntu
    group: ubuntu
    mode: '0600'
  no_log: true
  when: video_mask_release_repo | default('') | length > 0

- name: Checkout source-free release repository for Worker
  ansible.builtin.git:
    repo: "{{ video_mask_release_repo }}"
    dest: "{{ video_mask_release_dir | default('/home/ubuntu/video-mask-release') }}"
    version: "{{ video_mask_release_ref | default('main') }}"
    update: true
    accept_newhostkey: true
    key_file: "{{ video_mask_release_deploy_key_path | default('/home/ubuntu/.ssh/video-mask-release') }}"
  become_user: ubuntu
  when: video_mask_release_repo | default('') | length > 0

- name: Checkout video-mask repository
  ansible.builtin.git:
    repo: "{{ video_mask_repo }}"
    dest: "{{ video_mask_app_dir }}"
    version: "{{ video_mask_ref }}"
    update: true
    accept_newhostkey: true
  become_user: ubuntu

- name: Provision Worker credential on the controller
  ansible.builtin.uri:
    url: "{{ video_mask_controller_url }}/api/admin/workers"
    method: POST
    headers:
      Authorization: "Bearer {{ video_mask_admin_token }}"
    body_format: json
    body:
      worker_id: "{{ video_mask_worker_id | default(inventory_hostname) }}"
      token: "{{ video_mask_worker_token }}"
    status_code: 200
  no_log: true

- name: Bootstrap CUDA face worker and dependencies
  ansible.builtin.command:
    cmd: bash scripts/bootstrap_server.sh --cuda --face-only
    chdir: "{{ video_mask_app_dir }}"
  changed_when: false

- name: Create Worker runtime directory
  ansible.builtin.file:
    path: /home/ubuntu/work/video-mask
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0750'

- name: Install Worker environment file
  ansible.builtin.template:
    src: video-mask-worker.env.j2
    dest: /etc/video-mask-worker.env
    owner: root
    group: root
    mode: '0600'
  notify: Restart video-mask worker

- name: Install Worker systemd service
  ansible.builtin.template:
    src: video-mask-worker.service.j2
    dest: /etc/systemd/system/video-mask-worker.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart video-mask worker

- name: Enable Worker service
  ansible.builtin.systemd:
    name: video-mask-worker
    enabled: true
    state: started
