---
- name: Install Worker Python prerequisites
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      - logrotate
    state: present
    update_cache: true

- name: Validate Worker slot count
  ansible.builtin.assert:
    that:
      - video_mask_worker_slots | default(1) | int >= 1
      - video_mask_worker_slots | default(1) | int <= 16
    fail_msg: video_mask_worker_slots must be between 1 and 16.

- name: Provision Worker slot credentials on the controller
  ansible.builtin.uri:
    url: "{{ video_mask_controller_url }}/api/admin/workers"
    method: POST
    headers:
      Authorization: "Bearer {{ video_mask_admin_token }}"
    body_format: json
    body:
      worker_id: "{{ video_mask_worker_id | default(inventory_hostname) }}-slot-{{ item }}"
      token: "{{ video_mask_worker_token }}"
    status_code: 200
  loop: "{{ range(1, (video_mask_worker_slots | default(1) | int) + 1) | list }}"
  no_log: true

- name: Bootstrap CUDA face worker and source dependencies
  ansible.builtin.command:
    cmd: bash scripts/bootstrap_server.sh --cuda --face-only
    chdir: "{{ video_mask_app_dir }}"
  register: video_mask_bootstrap
  changed_when: video_mask_bootstrap.rc == 75
  failed_when: video_mask_bootstrap.rc not in [0, 75]

- name: Reboot Worker after NVIDIA driver installation
  ansible.builtin.reboot:
    msg: Rebooting after NVIDIA driver installation for Video Mask Worker
    reboot_timeout: 900
  when: video_mask_bootstrap.rc == 75

- name: Complete Worker bootstrap after NVIDIA driver reboot
  ansible.builtin.command:
    cmd: bash scripts/bootstrap_server.sh --cuda --face-only
    chdir: "{{ video_mask_app_dir }}"
  when: video_mask_bootstrap.rc == 75
  changed_when: false

- name: Create Worker slot runtime directories
  ansible.builtin.file:
    path: "/home/ubuntu/work/video-mask/slot-{{ item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0750'
  loop: "{{ range(1, (video_mask_worker_slots | default(1) | int) + 1) | list }}"

- name: Create Worker persistent output directory
  ansible.builtin.file:
    path: /home/ubuntu/outputs
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0750'

- name: Create Worker persistent log directory
  ansible.builtin.file:
    path: /var/log/video-mask-worker
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0750'

- name: Install Worker log rotation policy
  ansible.builtin.template:
    src: video-mask-worker.logrotate.j2
    dest: /etc/logrotate.d/video-mask-worker
    owner: root
    group: root
    mode: '0644'

- name: Install Worker slot environment files
  ansible.builtin.template:
    src: video-mask-worker.env.j2
    dest: "/etc/video-mask-worker@slot-{{ worker_slot }}.env"
    owner: root
    group: root
    mode: '0600'
  loop: "{{ range(1, (video_mask_worker_slots | default(1) | int) + 1) | list }}"
  loop_control:
    loop_var: worker_slot
  notify: Restart video-mask worker

- name: Stop legacy single Worker service during slot migration
  ansible.builtin.systemd:
    name: video-mask-worker
    enabled: false
    state: stopped
  failed_when: false

- name: Find enabled Worker slot services from an earlier deployment
  ansible.builtin.find:
    paths: /etc/systemd/system/multi-user.target.wants
    patterns: 'video-mask-worker@slot-*.service'
    file_type: link
  register: installed_worker_slots

- name: Disable Worker slots above the configured concurrency
  ansible.builtin.systemd:
    name: "{{ item.path | basename | regex_replace('\\.service$', '') }}"
    enabled: false
    state: stopped
  loop: "{{ installed_worker_slots.files }}"
  when: >-
    (item.path | basename | regex_replace('^video-mask-worker@slot-([0-9]+)\\.service$', '\\1') | int)
    > (video_mask_worker_slots | default(1) | int)

- name: Retire disabled excess Worker slots from the controller
  ansible.builtin.uri:
    url: "{{ video_mask_controller_url }}/api/admin/workers/{{ video_mask_worker_id | default(inventory_hostname) }}-slot-{{ item }}/retire"
    method: POST
    headers:
      Authorization: "Bearer {{ video_mask_admin_token }}"
    status_code: 200
  loop: "{{ range((video_mask_worker_slots | default(1) | int) + 1, 17) | list }}"
  # A running/busy slot is deliberately rejected by the Controller. Do not
  # hide it just because a playbook reduced the desired slot count.
  no_log: true

- name: Install Worker slot systemd service template
  ansible.builtin.template:
    src: video-mask-worker.service.j2
    dest: /etc/systemd/system/video-mask-worker@.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart video-mask worker

- name: Enable Worker slot services
  ansible.builtin.systemd:
    name: "video-mask-worker@slot-{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ range(1, (video_mask_worker_slots | default(1) | int) + 1) | list }}"

- name: Restart Worker slots after a requested source update
  ansible.builtin.systemd:
    name: "video-mask-worker@slot-{{ item }}"
    state: restarted
  loop: "{{ range(1, (video_mask_worker_slots | default(1) | int) + 1) | list }}"
  when: video_mask_restart_worker | default(false) | bool
