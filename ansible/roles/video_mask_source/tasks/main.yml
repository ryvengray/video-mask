---
- name: Validate source deployment configuration
  ansible.builtin.assert:
    that:
      - video_mask_repo is defined
      - video_mask_repo | length > 0
    fail_msg: >-
      Configure video_mask_repo before deploying source mode.
  when: video_mask_manage_source | default(true) | bool

- name: Install source checkout prerequisite
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: true
  when: video_mask_manage_source | default(true) | bool

- name: Checkout video-mask source repository
  ansible.builtin.git:
    repo: "{{ video_mask_repo }}"
    dest: "{{ video_mask_app_dir | default('/home/ubuntu/video-mask') }}"
    version: "{{ video_mask_ref | default('main') }}"
    update: true
  become_user: ubuntu
  when: video_mask_manage_source | default(true) | bool
